<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071BC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A6D6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond circulaire -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)" opacity="0.2" stroke="#0071BC" stroke-width="2"/>
  
  <!-- Formes géométriques -->
  <polygon points="100,30 140,70 100,110 60,70" fill="#0071BC"/>
  <polygon points="100,110 140,150 100,190 60,150" fill="#00A6D6"/>
  <rect x="60" y="70" width="80" height="40" fill="none" stroke="#00A6D6" stroke-width="2"/>
  
  <!-- Texte -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0071BC" text-anchor="middle">S.G.</text>
</svg>
